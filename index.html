<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101112">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KITCHEN ТТК">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KITCHEN ТТК</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#1b1d1f;--panel2:#24272a;--line:#34383c;--text:#f5f5f2;--muted:#a5abb1;--accent:#b7ef78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 15px calc(24px + env(safe-area-inset-bottom));}
header{padding:18px 2px 14px;position:sticky;top:0;background:rgba(16,17,18,.96);backdrop-filter:blur(14px);z-index:5}
.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:#252a22;display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;letter-spacing:.5px;margin:0}.sub{color:var(--muted);font-size:11px;letter-spacing:1.3px;margin-top:3px}
.search{width:100%;margin-top:17px;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:14px 15px;color:var(--text);font-size:16px;outline:none}.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 13px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:30px;background:transparent;color:#d9dcdf;padding:9px 13px;font-size:13px}.chip.active{background:var(--accent);border-color:var(--accent);color:#151911;font-weight:700}
.toolbar{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;padding:2px 2px 12px}.section{margin:13px 0 18px}.section h2{font-size:12px;letter-spacing:1.5px;color:var(--accent);margin:0 2px 9px;text-transform:uppercase}
.dish{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin:8px 0;overflow:hidden}.dishhead{display:flex;align-items:center;gap:9px;padding:15px;min-height:58px}.dishname{font-weight:700;font-size:16px;flex:1}.meta{font-size:11px;color:var(--muted);margin-top:4px}.arrow{color:var(--muted);font-size:19px}.star{border:0;background:none;color:#687078;font-size:21px;padding:2px 3px}.star.on{color:#ffd36b}.ingredients{border-top:1px solid var(--line);padding:5px 15px 13px}.ingredient{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:15px;line-height:1.3}.ingredient:last-child{border:0}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}.missing{font-size:10px;color:#ffc56e;border:1px solid #66502e;padding:4px 7px;border-radius:20px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:45px 10px}.bottom{color:#697078;text-align:center;font-size:11px;padding:18px 0 5px}.editbar{display:flex;gap:8px;margin-top:10px}.smallbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 11px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo">🔪</div><div><h1>KITCHEN ТТК</h1><div class="sub">КУХОННАЯ ШПАРГАЛКА</div></div></div>
 <input id="search" class="search" type="search" placeholder="⌕  Найти блюдо или ингредиент…" autocomplete="off">
</header>
<nav id="chips" class="chips"></nav>
<div class="toolbar"><span id="count">Загрузка…</span><div style="display:flex;gap:6px"><button class="smallbtn" id="addDish">＋ Блюдо</button><button class="smallbtn" id="favOnly">☆ Избранное</button></div></div>
<main id="content"></main>
<div class="bottom">Изменения сохраняются на этом iPhone · KITCHEN ТТК</div>
<script>
const originalMenu = [{"category": "Каши", "dishes": [{"name": "Каша овсяная", "ingredients": ["Овсяная кашка — 50 г", "Вода — 60 г", "Молоко — 100 г"]}, {"name": "Каша из полбы", "ingredients": ["Красный лук — 10 г", "Грибы — 20 г", "Грибной бульон — 50 г", "Полба — 130 г", "Сливочное масло — 20 г", "Петрушка", "Томатная сальса — 30 г"]}, {"name": "Каша рисовая на кокосе", "ingredients": ["Рис — 130 г", "Кокосовое молоко — 100 г", "Кокосовые сливки — 30 г", "Лимонграс — 20 г"]}]}, {"category": "Сладкие завтраки", "dishes": [{"name": "Сырники", "ingredients": ["Сырники — 4 шт."]}, {"name": "Мини-оладьи", "ingredients": ["Замес на оладьи — 110 г"]}, {"name": "Блины", "ingredients": ["С яблоком — 2 шт.", "С творогом — 2 шт.", "С икрой — 3 шт.", "Со сметаной — 3 шт."]}]}, {"category": "ЗОЖ", "dishes": [{"name": "Кабачковые оладьи", "ingredients": ["База на оладьи — 120 г", "Яйцо — 1 шт.", "Мука — 20 г", "Соль", "Шпинат — 20 г (жарить)"]}, {"name": "Омлет из белков", "ingredients": ["Белки — 110 г (взбить)"]}]}, {"category": "Сытные завтраки", "dishes": [{"name": "Завтрак Fields", "ingredients": ["Яйцо всмятку — 1 шт."]}, {"name": "Круассан Рояль", "ingredients": ["Яйцо пашот — 2 шт.", "Соус голландез — 20 г"]}, {"name": "Завтрак с колбасками", "ingredients": ["Колбаски — 100 г", "Помидор — 50 г (половина, с сахаром)", "Глазунья — 1 шт."]}, {"name": "Драник", "ingredients": ["Драник — 2 шт.", "Яйцо пашот — 1 шт."]}, {"name": "Шакшука", "ingredients": ["База шакшука — 150 г", "Яйцо — 3 шт.", "Соль"]}, {"name": "Скрембл с креветками", "ingredients": ["База на скрембл — 120 г", "Креветки — 4 шт. (целые)"]}, {"name": "Омлет с трюфельным бри", "ingredients": ["Яйцо — 3 шт.", "Куриный бульон — для соуса", "Сливочное масло — 20 г", "Соль, перец"]}]}, {"category": "Салаты / закуски", "dishes": [{"name": "Запечённый батат", "ingredients": ["Батат — 150 г (6 минут в парике)", "Соус умами"]}, {"name": "Кальмар с лимоном", "ingredients": ["Кальмар — 50 г", "Цукини — 140 г (дольками)", "Вода — 20 г", "Сливочное масло — 20 г", "Соус чимичурри — 5 г", "Лимонный фреш — 2 г", "Соль"]}, {"name": "Салат с тигровыми", "ingredients": ["Креветки — 4 шт. (целые)"]}, {"name": "Нисуаз с тунцом", "ingredients": ["Картошка бэби — 20 г", "Тунец — 35 г", "Соль, перец"]}, {"name": "Цезарь", "ingredients": ["Шницель — 1 шт."]}]}, {"category": "На хлебе", "dishes": [{"name": "Сэндвич с уткой", "ingredients": ["Груша — 40 г", "Сливочное масло — 20 г", "Сахар — 30 г"]}, {"name": "Гречневая пита с креветками", "ingredients": ["Пита — 1 шт.", "Креветки — 3 шт. (пополам)"]}]}, {"category": "Пасты", "dishes": [{"name": "Карбонара", "ingredients": ["Пастрами — 50 г", "Бульон — 40 г", "Сливочное масло — 20 г", "Пармезан — 20 г", "Желток пастеризованный — 20 г", "Соус демиглас — 10 г", "Спагетти — 100 г"]}, {"name": "Фетучини", "ingredients": ["Креветка — 1 шт. (мелко)", "Вонголе — 3 шт.", "Цедра лимона — 2 г", "Лимонный фреш — 10 г", "Кальмар — 50 г", "Рыбный бульон — 20 г", "Устричный соус — 30 г", "Сливочное масло — 20 г", "Пармезан — 10 г", "Шпинат — 10 г", "Паста лимонная — 1 шт. (6 мин)"]}, {"name": "Арабиата с креветками", "ingredients": ["Паста арабиата — 1 шт. (5 мин)", "Креветки — 3 шт. (пополам)", "Перец чили — 2 г", "Рыбный бульон — 20 г", "База на арабиата — 120 г", "Сливочное масло — 20 г", "Пармезан — 20 г", "Базилик — 5 г"]}, {"name": "Болоньезе", "ingredients": ["База болоньезе — 150 г", "Спагетти — 100 г", "Сливочное масло — 30 г"]}, {"name": "Паста с курицей", "ingredients": ["Курица — 50 г", "Мускатный орех — 1 г", "Грибы белые — 20 г", "Куриный бульон — 30 г", "Тальятелле — 100 г", "Сливки — 30 г", "Креметте — 10 г", "Соль, перец"]}]}, {"category": "Супы", "dishes": [{"name": "Луковый", "ingredients": ["База луковая — 300 г", "Хлеб-сухарь — 20 г", "Раклетто — 40 г"]}, {"name": "Уха", "ingredients": ["Рыбный бульон — 330 г", "Лось — 30 г", "Судак — 30 г", "Тилапия — 30 г", "Стружка тунца — 1 г", "Картофель мини — 40 г", "Розовый томат — 50 г", "Шпинат мини — 5 г"]}, {"name": "Суп-лапша", "ingredients": ["Кура — 60 г", "Морковь — 10 г", "Куриный бульон — 320 г", "Лапша — 15 г"]}, {"name": "Чечевичный суп", "ingredients": ["База на чечевицу — 270 г", "Вода — 30 г"]}]}, {"category": "Горячее", "dishes": [{"name": "Котлета из цыплёнка", "ingredients": ["Котлеты из курицы — 2 шт.", "Слайс помидора — 2 шт.", "Куриный бульон — для эмульсии", "Петрушка — для эмульсии", "Сливочное масло — 20 г"]}, {"name": "Котлета из говядины", "ingredients": ["Котлета — 1 шт.", "Пюре — 150 г", "Трюфельный соус — 1 ложка"]}, {"name": "Судак с вонголе", "ingredients": ["ТТК пока нет"], "missing": true}, {"name": "Котлета из лосося", "ingredients": ["Рыбная котлета — 2 шт.", "Пюре — 60 г", "Сливки — 30 г (соус)"]}, {"name": "Цыплёнок Кранч", "ingredients": ["ТТК пока нет"], "missing": true}, {"name": "Лосось конфи", "ingredients": ["Лосось — 140 г", "Растительное масло — 30 г", "Умами-глазурь", "Брокколи — 25 г", "Цветная капуста — 25 г"]}]}, {"category": "Гарниры", "dishes": [{"name": "Рис с овощами", "ingredients": ["Рис басмати — 70 г", "Рис дикий — 30 г", "Лук-порей — 35 г", "Морковь — 20 г", "Шпинат — 40 г", "Сливочное масло — 15 г"]}, {"name": "Овощи на гриле", "ingredients": ["Цукини — 70 г", "Томаты — 70 г", "Болгарский перец — 30 г", "Шампиньоны — 30 г"]}, {"name": "Овощи на пару", "ingredients": ["Цветная капуста — 70 г", "Брокколи — 70 г", "Морковь — 30 г"]}]}];
const STORAGE='kitchen-ttk-v1';
let custom=JSON.parse(localStorage.getItem(STORAGE)||'null');
let data=custom?.data||originalMenu;
let favorites=new Set(custom?.favorites||[]);
let active='Все', favMode=false, expanded='';
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(STORAGE,JSON.stringify({data,favorites:[...favorites]}))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function allDishes(){return data.flatMap(s=>s.dishes.map(d=>({...d,category:s.category})))}
function renderChips(){
 const cats=['Все',...data.map(s=>s.category)];
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${active===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
 $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;favMode=false;$('#favOnly').classList.remove('active');render()});
}
function render(){
 renderChips();
 const q=$('#search').value.trim().toLocaleLowerCase('ru');
 const filtered=data.map(sec=>({...sec,dishes:sec.dishes.filter(d=>{
  const key=sec.category+' '+d.name+' '+d.ingredients.join(' ');
  return (active==='Все'||active===sec.category)&&(!q||key.toLocaleLowerCase('ru').includes(q))&&(!favMode||favorites.has(d.name));
 })})).filter(s=>s.dishes.length);
 const count=filtered.reduce((n,s)=>n+s.dishes.length,0);
 $('#count').textContent=`${count} ${count===1?'блюдо':count<5?'блюда':'блюд'}${favMode?' · избранное':''}`;
 if(!count){$('#content').innerHTML='<div class="empty">Ничего не найдено<br><small>Попробуй другое название</small></div>';return}
 $('#content').innerHTML=filtered.map(sec=>`<section class="section"><h2>${escapeHtml(sec.category)}</h2>${sec.dishes.map(d=>{
  const key=d.name,open=expanded===key;
  return `<article class="dish"><div class="dishhead"><div style="flex:1" data-open="${escapeHtml(key)}"><div class="dishname">${escapeHtml(d.name)}</div><div class="meta">${d.ingredients.length} позиций</div></div>${d.missing?'<span class="missing">НЕТ ТТК</span>':''}<button class="star ${favorites.has(key)?'on':''}" data-star="${escapeHtml(key)}" aria-label="Избранное">${favorites.has(key)?'★':'☆'}</button><span class="arrow" data-open="${escapeHtml(key)}">${open?'⌃':'⌄'}</span></div>${open?`<div class="ingredients">${d.ingredients.map(i=>`<div class="ingredient"><span class="dot"></span><span>${escapeHtml(i)}</span></div>`).join('')}<div class="editbar"><button class="smallbtn" data-edit="${escapeHtml(key)}">✎ Изменить ТТК</button></div></div>`:''}</article>`;
 }).join('')}</section>`).join('');
 $('#content').querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{expanded=expanded===el.dataset.open?'':el.dataset.open;render()});
 $('#content').querySelectorAll('[data-star]').forEach(el=>el.onclick=()=>{const k=el.dataset.star;favorites.has(k)?favorites.delete(k):favorites.add(k);save();render()});
 $('#content').querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>editDish(el.dataset.edit));
}
function editDish(name){
 const dish=allDishes().find(d=>d.name===name);if(!dish)return;
 const val=prompt('Одна позиция на строку. Отредактируй ингредиенты:',dish.ingredients.join('\\n'));
 if(val===null)return;
 const ingredients=val.split('\\n').map(x=>x.trim()).filter(Boolean);
 for(const sec of data){const d=sec.dishes.find(x=>x.name===name);if(d){d.ingredients=ingredients;break}}
 save();expanded=name;render();
}
$('#search').addEventListener('input',()=>{expanded='';render()});
$('#favOnly').onclick=()=>{favMode=!favMode;$('#favOnly').classList.toggle('active',favMode);expanded='';render()};
$('#addDish').onclick=()=>{
 const category=prompt('В какую категорию добавить блюдо?\\n'+data.map(s=>s.category).join(', '),active!=='Все'?active:'Пасты');
 if(!category)return;
 let section=data.find(s=>s.category.toLocaleLowerCase('ru')===category.trim().toLocaleLowerCase('ru'));
 if(!section){if(!confirm('Такой категории нет. Создать категорию «'+category+'»?'))return;section={category:category.trim(),dishes:[]};data.push(section);}
 const name=prompt('Название блюда:');if(!name)return;
 if(allDishes().some(d=>d.name.toLocaleLowerCase('ru')===name.trim().toLocaleLowerCase('ru'))){alert('Блюдо с таким названием уже есть.');return;}
 const raw=prompt('Ингредиенты — каждый с новой строки:');if(raw===null)return;
 section.dishes.push({name:name.trim(),ingredients:raw.split('\\n').map(x=>x.trim()).filter(Boolean)});
 save();active=section.category;favMode=false;expanded=name.trim();render();
};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
